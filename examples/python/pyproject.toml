[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docimprint-examples"
version = "0.1.0"
description = "Community DocImprint demos: prove what an agent read — claim-check, evidence bundles, action receipts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "DocImprint" }]
dependencies = [
  "docimprint>=0.1.1",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[project.scripts]
docimprint-prove = "docimprint_examples.prove_what_agent_read:main"
docimprint-production-flow = "docimprint_examples.production_flow:main"

[project.urls]
Homepage = "https://docimprint.com"
Documentation = "https://docimprint.com/docs"
Repository = "https://github.com/sawftware-apps/docimprint-sdk/tree/main/examples/python"

[tool.hatch.build.targets.wheel]
packages = ["src/docimprint_examples"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/pyproject.toml",
  "/.env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
